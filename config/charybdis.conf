CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Отключение 2M PHY — обход проблемы сопряжения с адаптерами Intel AX-серии
# (AX200/AX201) под Linux/BlueZ: сопряжение падает на этапе аутентификации.
# Рекомендация из документации ZMK по connection issues. Настройка глобальная,
# затрагивает и линк между половинами — там трафик мизерный, потери не заметны.
# Если окажется, что дело было не в этом, строку можно убрать.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# === Отключение глубокого сна ===
CONFIG_ZMK_SLEEP=n

# 启用键盘RGB功能
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# === Настройки для программиста ===
# Увеличить буфер клавиш (для быстрой печати)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Combo настройки
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=5
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4


# =====================================================================
# Неактивные опции — закомментированы, оставлены для истории/референса
# =====================================================================

# Legacy-режим BLE Link Layer Control Procedures — иногда нужен для
# совместимости со старыми BLE-центральными устройствами. Не включено.
# CONFIG_BT_LL_SW_LLCP_LEGACY=y

# Тюнинг параметров BLE-соединения (интервал/латентность/буферы) —
# похоже на незавершённый эксперимент по задержке/пропускной способности
# BLE. Не включено.
