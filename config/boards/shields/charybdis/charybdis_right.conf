CONFIG_SPI=y
CONFIG_INPUT=y
# ZMK_MOUSE помечен в ZMK как (Deprecated), актуальное имя — ZMK_POINTING.
CONFIG_ZMK_POINTING=y

# Peripheral latency = 0 для связи с хостом.
# Дефолт ZMK — 30: периферии разрешено спать, пропуская до 30 connection
# event'ов. Для клавиатуры это экономия батареи, для трекбола — беда:
# отчёты копятся и уезжают пачками. Замер btmon показал разрывы ровно
# в 5-6 интервалов по 11.25 мс, то есть 19 пачек в секунду при 131 Гц
# самих отчётов — курсор дёргался, хотя данные все доходили.
# Ставится только для правой половины: она периферия по отношению к хосту.
# Цена — заметно больший расход батареи на правой половине.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

CONFIG_PMW3610=y
# Разрешение снижает сам сенсор, а не целочисленное деление.
# CPI_DIVIDOR применяется к raw до накопителя остатков (см. apply_acceleration),
# поэтому дробная часть терялась: на медленных движениях raw=1 давал 1/2=0,
# и чувствительность падала тем сильнее, чем медленнее ведёшь шар.
# История: CPI=2200 + DIVIDOR=2 (~1100 эффективных) -> 1200 без усечения
# -> 1000 -> 800 -> 600 (авг. 2026, было слишком быстро).
# Низкое значение осознанное: клавиатура ходит через DeskHop, который отдаёт
# хосту абсолютные координаты, поэтому системные настройки скорости курсора
# (и в macOS, и в Ubuntu) на неё не действуют. Регулировать можно только здесь.
# CPI кратен 200 — регистр считается как cpi/200, промежуточные значения
# округляются вниз. Поэтому 900 недостижимо: превратилось бы в 800.
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_90=y
# Ровно 200, а не 250: set_cpi() пишет в регистр cpi/200, то есть значение
# округляется вниз до кратного 200. Прежние 250 фактически работали как 200 —
# здесь просто написано то, что происходит на самом деле, поведение не изменилось.
# 200 — минимум диапазона (200–3200).
CONFIG_PMW3610_SNIPE_CPI=200
# Прокрутка использует CONFIG_PMW3610_CPI (не SNIPE_CPI), поэтому при
# снижении CPI порог уменьшается пропорционально (70 -> 58 -> 46 -> 35),
# чтобы скорость прокрутки оставалась прежней.
CONFIG_PMW3610_SCROLL_TICK=35
CONFIG_PMW3610_CARET_TICK=20
CONFIG_PMW3610_INVERT_X=y

# === Pointer Acceleration ===
CONFIG_PMW3610_ACCEL_ENABLED=y
# Широкий диапазон: разгон начинается на мелких движениях и не упирается
# в потолок так рано, как раньше. Значения x100 (Kconfig не умеет float).
#   LOW  1.5 counts/мс — ниже множитель ровно 1.0 (было 3.0)
#   HIGH  28 counts/мс — здесь достигается максимум (было 20)
#   MAX  6.0x          — сам максимум (было 4.0)
# С квадратичной кривой опускать LOW дёшево: у нижней границы t^2 идёт
# плоско, поэтому точное наведение от этого почти не страдает.
CONFIG_PMW3610_ACCEL_LOW_SPEED=150
CONFIG_PMW3610_ACCEL_HIGH_SPEED=2800
CONFIG_PMW3610_ACCEL_MAX_MULT=600

# Форма разгона между LOW и HIGH. Одна из трёх, менять одной строкой:
#   CONFIG_PMW3610_ACCEL_CURVE_LINEAR=y      прямая (как было до авг. 2026)
#   CONFIG_PMW3610_ACCEL_CURVE_QUADRATIC=y   t^2 — широкая честная зона, резкий разгон в конце
#   CONFIG_PMW3610_ACCEL_CURVE_SMOOTHSTEP=y  S-кривая — как линейная, но без изломов на границах
# Множитель на скорости 5 / 12 / 20 / 30 counts/мс (при порогах ниже):
#   линейная     1.66 / 2.98 / 4.49 / 6.00
#   квадратичная 1.09 / 1.78 / 3.44 / 6.00   <- сейчас
#   smoothstep   1.24 / 2.73 / 4.91 / 6.00
CONFIG_PMW3610_ACCEL_CURVE_QUADRATIC=y

CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y


# =====================================================================
# Неактивные опции — закомментированы, оставлены для истории/референса
# =====================================================================

# Управление переключаемым питанием периферии (EXT_POWER). Не включено:
# в devicetree этой сборки нет соответствующего ext-power узла, поэтому
# сейчас опция ни на что не влияет. Включать только вместе с добавлением
# ext-power в overlay.
# CONFIG_ZMK_EXT_POWER=y

# Альтернативный делитель CPI для snipe-режима — пробовался вместо
# текущего CONFIG_PMW3610_SNIPE_CPI=200, но давал залипание по одной оси.
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4

# Automouse: автоматическое временное переключение на layer с настройками
# мыши при движении трекбола. Не используется — режимы трекбола здесь и
# так управляются слоями (snipe/scroll/caret) через ручные lt/mo.
# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

# Драйвер поворотного энкодера EC11 — на этой сборке энкодера физически
# нет (не описан ни в одном overlay), унаследовано из исходного шаблона.
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Отладочное логирование по USB. Выключено намеренно.
# Все три LOG_DBG драйвера сидят внутри pmw3610_report_data(), то есть в
# горячем пути: он отрабатывает 125 раз в секунду, пока шар в движении, и
# на каждом опросе форматировал строку. При выключенном ZMK_LOG_LEVEL_DBG
# вызовы LOG_DBG вырезаются на этапе компиляции, а не проверяются в рантайме,
# поэтому накладные расходы уходят полностью.
#
# Включать временно, когда нужно ловить поведение сенсора; для повседневной
# работы на батарее держать выключенным.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_SENSOR_LOG_LEVEL_DBG=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
