CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=2200
CONFIG_PMW3610_CPI_DIVIDOR=2
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_SNIPE_CPI=250
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4  # old snipe divisor (axis stickiness)
CONFIG_PMW3610_SCROLL_TICK=70
CONFIG_PMW3610_CARET_TICK=20
CONFIG_PMW3610_INVERT_X=y

# === Логирование для диагностики ===
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y

# === Pointer Acceleration ===
CONFIG_PMW3610_ACCEL_ENABLED=y
CONFIG_PMW3610_ACCEL_LOW_SPEED=300
CONFIG_PMW3610_ACCEL_HIGH_SPEED=2000
CONFIG_PMW3610_ACCEL_MAX_MULT=400

CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y

