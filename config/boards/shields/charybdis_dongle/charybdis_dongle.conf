# ДОНГЛ: central. Втыкается в USB и работает как проводная HID-клавиатура,
# в том числе в BIOS.
#
# Роль, число периферий и лимиты соединений заданы в Kconfig.defconfig.

CONFIG_ZMK_POINTING=y

# Указатель приходит с периферии через zmk,input-split.
CONFIG_ZMK_INPUT_SPLIT=y

# Донгл всегда в USB — глубокий сон не нужен и мешал бы.
CONFIG_ZMK_SLEEP=n

# Питание от USB, можно не жалеть радио.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# То же, что в основном варианте: обход проблемы сопряжения с адаптерами
# Intel AX-серии под Linux/BlueZ. На линк с половинами влияет тоже.
CONFIG_BT_CTLR_PHY_2M=n

# Дребезг и комбо — как в config/charybdis.conf: раскладку резолвит донгл.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=5
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4
