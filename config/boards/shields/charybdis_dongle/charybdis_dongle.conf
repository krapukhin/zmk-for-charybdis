# ДОНГЛ: central. Втыкается в USB и работает как проводная HID-клавиатура,
# в том числе в BIOS.
#
# Роль, число периферий и лимиты соединений заданы в Kconfig.defconfig.

CONFIG_ZMK_POINTING=y

# Указатель приходит с периферии через zmk,input-split.
CONFIG_ZMK_INPUT_SPLIT=y

# Донгл всегда в USB — глубокий сон не нужен и мешал бы.
CONFIG_ZMK_SLEEP=n

# Питание от USB, можно не жалеть радио.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# То же, что в основном варианте: обход проблемы сопряжения с адаптерами
# Intel AX-серии под Linux/BlueZ. На линк с половинами влияет тоже.
CONFIG_BT_CTLR_PHY_2M=n

# Дребезг и комбо — как в config/charybdis.conf: раскладку резолвит донгл.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=5
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# === Заряд батарей половин ===
#
# По USB заряд иначе не увидеть: ZMK отдаёт его через BAS, а это сервис
# Bluetooth. Поэтому донгл опрашивает периферию сам и пишет результат в лог.
#
# Читать:  cat /dev/ttyACM0
# Строки:  BATTERY peripheral 0: 72%
#
# BATTERY_LEVEL_PROXY намеренно НЕ включён: он публикует заряд отдельным
# BAS-сервисом, что нужно только при подключении донгла по BLE. Плюс в
# трекере ZMK есть issue #3095 — ошибка сборки при включении FETCHING и
# PROXY одновременно для конфигурации из трёх и более частей.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_LOG=y

CONFIG_ZMK_USB_LOGGING=y

# БЕЗ ЭТОГО ЛОГ НЕЧИТАЕМ. ZMK при включённом логировании выставляет
# ZMK_LOG_LEVEL default 4, то есть DEBUG для всего: в лог сыплется каждое
# событие указателя, 125 раз в секунду. ZMK_LOGGING_MINIMAL — штатный тумблер
# ("Suppress all ZMK debug log messages"), после него остаются только INFO
# и выше. Наш модуль zmk_battery_log зарегистрирован с явным LOG_LEVEL_INF,
# поэтому его строки видны.
CONFIG_ZMK_LOGGING_MINIMAL=y

# ZMK_BATTERY_REPORTING выключать НЕЛЬЗЯ, хотя своей батареи у донгла нет.
# В app/CMakeLists.txt именно от этой опции зависит сборка
# src/events/battery_state_changed.c, который определяет сами события. Без него
# не линкуется ни наш логгер, ни код самого ZMK: split/central.c дёргает
# raise_zmk_peripheral_battery_state_changed().
#
# Поэтому опрос оставляем включённым, а бессмысленную строку про собственную
# батарею (ADC донгла на USB читает мусор, в логе было 4148 mV -> "94%")
# глушим отдельным ключом ниже.
CONFIG_ZMK_BATTERY_LOG_SELF=n
