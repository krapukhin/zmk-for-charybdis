# Выкладывает шпаргалку notes/charybdis-cheatsheet.html на GitHub Pages как есть.
# Пересобирать её нужно локально (python3 notes/build_cheatsheet.py): в CI нет
# ~/.config/run-or-raise/shortcuts.conf, и раздел Hyper вышел бы пустым.
# Одноразово: Settings -> Pages -> Source: GitHub Actions.
name: Cheatsheet on Pages

on:
  workflow_dispatch:
  push:
    branches: [Charybdis_4x6]
    paths:
      - notes/charybdis-cheatsheet.html
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp notes/charybdis-cheatsheet.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
